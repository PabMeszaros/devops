<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Days Events</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .event {
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
      }
      .event img {
        max-width: 100px;
        display: block;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>DevOps Days Events</h1>
    <div id="events">
      <div class="event">
        <img src="logo_paris.jpg" alt="Event Logo" />
        <p><strong>Location:</strong> Paris, France</p>
        <p><strong>Date:</strong> 2025-05-15</p>
      </div>
      <div class="event">
        <img src="logo_berlin.jpg" alt="Event Logo" />
        <p><strong>Location:</strong> Berlin, Germany</p>
        <p><strong>Date:</strong> 2025-06-20</p>
      </div>
      <div class="event">
        <img src="logo_newyork.jpg" alt="Event Logo" />
        <p><strong>Location:</strong> New York, USA</p>
        <p><strong>Date:</strong> 2025-07-10</p>
      </div>
    </div>
  </body>
</html>
